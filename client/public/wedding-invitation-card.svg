<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3f0"/>
      <stop offset="100%" stop-color="#f3ddd4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbf6ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7a4b3a" flood-opacity="0.28"/>
    </filter>
    <g id="sprig">
      <path d="M0 0 C 26 -18 46 -46 52 -80" fill="none" stroke="#c98a6b" stroke-width="3" stroke-linecap="round"/>
      <path d="M24 -18 C 40 -22 54 -34 62 -52" fill="none" stroke="#c98a6b" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="14" cy="-12" rx="9" ry="5" transform="rotate(-38 14 -12)" fill="#e7b7a3"/>
      <ellipse cx="40" cy="-30" rx="9" ry="5" transform="rotate(-30 40 -30)" fill="#e7b7a3"/>
      <ellipse cx="58" cy="-56" rx="8" ry="4.5" transform="rotate(-24 58 -56)" fill="#e7b7a3"/>
      <ellipse cx="30" cy="-6" rx="8" ry="4.5" transform="rotate(-70 30 -6)" fill="#d99c86"/>
    </g>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="300" fill="#ffffff" opacity="0.35"/>

  <!-- invitation card -->
  <g filter="url(#shadow)" transform="rotate(-3 400 400)">
    <rect x="185" y="150" width="430" height="500" rx="8" fill="url(#paper)"/>
    <rect x="205" y="170" width="390" height="460" rx="4" fill="none" stroke="#d9b26a" stroke-width="2.5"/>
    <rect x="214" y="179" width="372" height="442" rx="3" fill="none" stroke="#e6cf9d" stroke-width="1"/>
  </g>

  <!-- florals -->
  <use href="#sprig" transform="translate(215 190)"/>
  <use href="#sprig" transform="translate(585 190) scale(-1 1)"/>
  <use href="#sprig" transform="translate(215 630) scale(1 -1)"/>
  <use href="#sprig" transform="translate(585 630) scale(-1 -1)"/>

  <!-- monogram -->
  <circle cx="400" cy="255" r="34" fill="none" stroke="#c9a24f" stroke-width="2"/>
  <text x="400" y="268" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#b8893a">A&amp;D</text>

  <text x="400" y="345" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="6" fill="#a97f5c">WEDDING</text>
  <text x="400" y="385" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="6" fill="#a97f5c">INVITATION</text>

  <line x1="320" y1="410" x2="480" y2="410" stroke="#e0c391" stroke-width="1.6"/>
  <circle cx="400" cy="410" r="4" fill="#c9a24f"/>

  <text x="400" y="465" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#6b4b3a">Aarav &amp; Diya</text>
  <text x="400" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#9c8173">together with their families</text>

  <text x="400" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#7a5a48">Sunday, 14 December 2026</text>
  <text x="400" y="588" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#a08a7c">The Grand Palace, Jaipur</text>
</svg>
